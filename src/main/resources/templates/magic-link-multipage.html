<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registration Flow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .page-container {
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hidden {
            display: none !important;
        }
        .success-icon, .error-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        .success-icon {
            background-color: #28a745;
        }
        .error-icon {
            background-color: #dc3545;
        }
        .success-icon svg, .error-icon svg {
            width: 50px;
            height: 50px;
            fill: white;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <!-- Page 0: Welcome/Prompt -->
            <div id="page-0" class="card page-container hidden">
                <div class="card-body text-center">
                    <h3 class="card-title mb-4" id="page-0-title"></h3>
                    <p class="text-muted mb-4" id="page-0-description"></p>
                    <button id="page-0-button" class="btn btn-primary btn-lg px-5"></button>
                </div>
            </div>

            <!-- Page 1: Registration Form -->
            <div id="page-1" class="card page-container hidden">
                <div class="card-body">
                    <h3 class="card-title mb-4" id="page-1-title"></h3>
                    <p class="text-muted mb-4" id="page-1-description"></p>
                    <form id="registration-form">
                        <div id="form-fields"></div>
                        <button type="submit" id="page-1-button" class="btn btn-primary w-100 mt-3"></button>
                    </form>
                </div>
            </div>

            <!-- Page 2: Loading -->
            <div id="page-2" class="card page-container hidden">
                <div class="card-body text-center py-5">
                    <div class="spinner-border spinner-border-lg text-primary mb-4" style="width: 4rem; height: 4rem;" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <h4 class="mb-3" id="page-2-title"></h4>
                    <p class="text-muted mb-4" id="page-2-description"></p>
                    <div class="progress" style="height: 25px;">
                        <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated"
                             role="progressbar" style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                            <span id="progress-text">0%</span>
                        </div>
                    </div>
                    <p class="text-muted mt-3 small">Please wait, this may take a few seconds...</p>
                </div>
            </div>

            <!-- Page 3: MFA Code -->
            <div id="page-3" class="card page-container hidden">
                <div class="card-body">
                    <h3 class="card-title mb-4" id="page-3-title"></h3>
                    <p class="text-muted mb-4" id="page-3-description"></p>
                    <div class="alert alert-info">
                        <strong>Demo Mode:</strong> Check the browser console for the MFA code!
                    </div>
                    <form id="mfa-form">
                        <div class="mb-3">
                            <label for="mfaCode" class="form-label">Verification Code</label>
                            <input type="text" class="form-control" id="mfaCode" name="mfaCode"
                                   placeholder="Enter 6-digit code" required maxlength="6" pattern="\d{6}">
                        </div>
                        <button type="submit" id="page-3-button" class="btn btn-primary w-100"></button>
                    </form>
                </div>
            </div>

            <!-- Page 4: Success -->
            <div id="page-4" class="card page-container hidden">
                <div class="card-body text-center py-5">
                    <div class="success-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
                            <path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0z"/>
                        </svg>
                    </div>
                    <h4 class="mb-3" id="page-4-title"></h4>
                    <p class="text-muted mb-4" id="page-4-description"></p>
                    <div class="spinner-border text-success mb-3" role="status">
                        <span class="visually-hidden">Redirecting...</span>
                    </div>
                    <p class="text-muted">Redirecting to your dashboard...</p>
                </div>
            </div>

            <!-- Page 5: Error -->
            <div id="page-5" class="card page-container hidden">
                <div class="card-body text-center py-5">
                    <div class="error-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
                            <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM5.354 4.646a.5.5 0 1 0-.708.708L7.293 8l-2.647 2.646a.5.5 0 0 0 .708.708L8 8.707l2.646 2.647a.5.5 0 0 0 .708-.708L8.707 8l2.647-2.646a.5.5 0 0 0-.708-.708L8 7.293 5.354 4.646z"/>
                        </svg>
                    </div>
                    <h4 class="mb-3" id="page-5-title"></h4>
                    <p class="text-muted mb-4" id="page-5-description"></p>
                    <p class="text-danger" id="page-5-error"></p>
                    <a href="/login" class="btn btn-primary">Back to Login</a>
                </div>
            </div>

        </div>
    </div>
</div>

<script th:inline="javascript">
const token = /*[[${token}]]*/ '';
let formConfig = null;
let currentPageNumber = 0;

document.addEventListener('DOMContentLoaded', async function() {
    console.log('Initializing multi-page form with token:', token);
    await loadFormConfig();
    showCurrentPage();
});

async function loadFormConfig() {
    try {
        const response = await fetch(`/api/magic-link/form?token=${encodeURIComponent(token)}`);
        formConfig = await response.json();
        console.log('Form config loaded:', formConfig);
        currentPageNumber = formConfig.currentPage || 0;
    } catch (error) {
        console.error('Error loading form config:', error);
        showError('Failed to load form configuration');
    }
}

function showCurrentPage() {
    // Hide all pages
    for (let i = 0; i <= 5; i++) {
        document.getElementById(`page-${i}`).classList.add('hidden');
    }

    const page = formConfig.pages[currentPageNumber];
    console.log('Showing page:', currentPageNumber, page);

    // Show current page
    document.getElementById(`page-${currentPageNumber}`).classList.remove('hidden');

    // Populate page content
    if (page.title) document.getElementById(`page-${currentPageNumber}-title`).textContent = page.title;
    if (page.description) document.getElementById(`page-${currentPageNumber}-description`).textContent = page.description;

    // Handle different page types
    if (page.pageType === 'prompt') {
        setupPromptPage(page);
    } else if (page.pageType === 'form') {
        setupFormPage(page);
    } else if (page.pageType === 'loading') {
        setupLoadingPage(page);
    } else if (page.pageType === 'mfa') {
        setupMfaPage(page);
    } else if (page.pageType === 'success') {
        setupSuccessPage(page);
    } else if (page.pageType === 'error') {
        setupErrorPage(page);
    }
}

function setupPromptPage(page) {
    const button = document.getElementById('page-0-button');
    button.textContent = page.buttonText;
    button.onclick = async () => {
        await submitPage(0, {});
    };
}

function setupFormPage(page) {
    const button = document.getElementById('page-1-button');
    button.textContent = page.buttonText;

    // Build form fields
    const fieldsContainer = document.getElementById('form-fields');
    fieldsContainer.innerHTML = '';

    page.fields.forEach(field => {
        const fieldHtml = createFormField(field);
        fieldsContainer.innerHTML += fieldHtml;
    });

    // Handle form submission
    document.getElementById('registration-form').onsubmit = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData.entries());
        await submitPage(1, data);
    };
}

function createFormField(field) {
    if (field.type === 'text') {
        return `
            <div class="mb-3">
                <label for="${field.name}" class="form-label">${field.label}${field.required ? ' *' : ''}</label>
                <input type="text" class="form-control" id="${field.name}" name="${field.name}"
                       placeholder="${field.placeholder || ''}" ${field.required ? 'required' : ''}>
            </div>
        `;
    } else if (field.type === 'select') {
        const options = field.options.map(opt =>
            `<option value="${opt.value}">${opt.label}</option>`
        ).join('');
        return `
            <div class="mb-3">
                <label for="${field.name}" class="form-label">${field.label}${field.required ? ' *' : ''}</label>
                <select class="form-select" id="${field.name}" name="${field.name}" ${field.required ? 'required' : ''}>
                    ${options}
                </select>
            </div>
        `;
    }
    return '';
}

function setupLoadingPage(page) {
    // Start polling for next page
    pollForNextPage();
}

async function pollForNextPage() {
    const interval = setInterval(async () => {
        try {
            const response = await fetch(`/api/magic-link/next-page?token=${encodeURIComponent(token)}`);
            const result = await response.json();

            console.log('Poll result:', result);

            // Update progress
            if (result.progress) {
                document.getElementById('progress-bar').style.width = result.progress + '%';
                document.getElementById('progress-text').textContent = result.progress + '%';
            }

            if (result.status === 'ready') {
                clearInterval(interval);
                // Navigate to next page
                currentPageNumber = result.pageNumber;
                showCurrentPage();
            } else if (result.status === 'failed') {
                clearInterval(interval);
                currentPageNumber = result.pageNumber;
                showCurrentPage();
            }
        } catch (error) {
            console.error('Polling error:', error);
            clearInterval(interval);
        }
    }, 2000); // Poll every 2 seconds
}

function setupMfaPage(page) {
    const button = document.getElementById('page-3-button');
    button.textContent = page.buttonText;

    // Handle MFA form submission
    document.getElementById('mfa-form').onsubmit = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData.entries());
        await submitPage(3, data);
    };
}

function setupSuccessPage(page) {
    // Auto-redirect after 3 seconds
    setTimeout(() => {
        window.location.href = '/';
    }, 3000);
}

function setupErrorPage(page) {
    const errorElement = document.getElementById('page-5-error');
    // Error message will be in page description
}

async function submitPage(pageNumber, data) {
    try {
        const response = await fetch(`/api/magic-link/submit-page?token=${encodeURIComponent(token)}&pageNumber=${pageNumber}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();
        console.log('Submit result:', result);

        if (result.status === 'success') {
            // Determine next page number based on nextPage type
            const nextPageMap = {
                'form': 1,
                'loading': 2,
                'mfa': 3,
                'success': 4,
                'error': 5
            };

            currentPageNumber = nextPageMap[result.nextPage] || currentPageNumber + 1;
            showCurrentPage();
        } else {
            alert('Error: ' + result.message);
        }
    } catch (error) {
        console.error('Submit error:', error);
        alert('An error occurred. Please try again.');
    }
}

function showError(message) {
    document.getElementById('page-5-description').textContent = message;
    currentPageNumber = 5;
    showCurrentPage();
}
</script>
</body>
</html>
